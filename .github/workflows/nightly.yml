# # Jobs:
# #   fuzz            — cargo-fuzz, 5 targets x 30 min wall clock each
# #   soak-props      — proptest soak with PROPTEST_CASES=100000
# #   sanitizers      — ASAN + TSAN runs of the meganum-core tests (nightly)
# #   bench-baseline  — criterion `nightly` baseline + artifact upload
# #   audit           — cargo-audit + cargo-deny
# #
# # All `uses:` are pinned to full 40-char commit SHAs (version noted in a
# # comment directly above each pin).
# # =============================================================================

