# # =============================================================================
# # MegaNum release pipeline (tags: v*)
# #
# # Order: build-artifacts (+ sdist) -> publish (TestPyPI for rc tags, PyPI
# # otherwise) -> post-verify (install from the live index) -> deploy-docs, and
# # finally the GitHub Release.
# #
# # * Trusted Publishing (OIDC) only — no tokens anywhere. Requires the GitHub
# #   environments `pypi` and `testpypi` configured as PyPI "GitHub publishers"
# #   for this repository.
# # * Every artifact gets build provenance attestation
# #   (actions/attest-build-provenance).
# # * Concurrency is keyed on the tag ref and never cancels in-progress runs.
# # * All `uses:` are pinned to full 40-char commit SHAs (version noted in a
# #   comment directly above each pin).
# # =============================================================================

