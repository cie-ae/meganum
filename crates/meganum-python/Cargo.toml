[package]
name = "meganum-python"
description = "PyO3 bindings for meganum: thin adapter exposing meganum-core to Python."
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "meganum"
crate-type = ["cdylib", "rlib"]

[dependencies]
meganum-core = { workspace = true, features = ["parallel", "simd"] }
# NOTE: `extension-module` must NOT be enabled here. It is only active for
# wheel builds (pyproject.toml [tool.maturin] features). With it on, pyo3
# stops linking libpython, so every cargo-linked binary (cargo test, the
# lib unittests, benches) fails at link time with undefined `_Py*`
# symbols on macOS. Wheel builds resolve those symbols at import time
# instead. See ADR-0009.
pyo3 = { workspace = true, features = ["abi3-py310"] }

[features]
default = []
# Opt-in, wheel builds only. NEVER enable it for cargo build/test/clippy
# of this crate: the resulting binaries do not link libpython and cannot
# resolve the Python C API (macOS: undefined `_Py*` symbols). See ADR-0009.
extension-module = ["pyo3/extension-module"]
# Pass-through features so `maturin ... --features parallel,simd` (set in
# pyproject.toml) activates the engine features on meganum-core.
parallel = ["meganum-core/parallel"]
simd = ["meganum-core/simd"]
# Expose _ref reference implementations to Python for differential testing.
test-refs = ["meganum-core/ref-impls"]
